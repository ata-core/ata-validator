# The tarball of a release, attested: when a release is published, the
# package is packed from the tag, a build provenance attestation is made for
# it (Sigstore, signed by this workflow's identity) and both are attached to
# the release with a checksum file. The npm publish in prebuild.yml carries
# its own provenance; this is the same statement for the GitHub release, so a
# consumer who takes the tarball from here can verify it with
# `gh attestation verify ata-validator-<version>.tgz --repo ata-core/ata-validator`.
# Separate from the publish job on purpose: a failure here leaves the npm
# publish untouched.
name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # The same install as the publish job: the lock cannot carry natives that
      # are published after the version bump, so no clean install.
      - name: Install dependencies
        run: npm install --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Pack
        id: pack
        run: |
          FILE=$(npm pack --ignore-scripts 2>/dev/null | tail -1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          sha256sum "$FILE" > SHA256SUMS
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.file }}
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" "${{ steps.pack.outputs.file }}.sigstore.json"
          gh release upload "${{ github.event.release.tag_name }}" "${{ steps.pack.outputs.file }}" "${{ steps.pack.outputs.file }}.sigstore.json" SHA256SUMS --clobber
