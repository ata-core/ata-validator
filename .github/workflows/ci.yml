name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Read-only: no job here writes to the repository or the registry.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      # `npm test` runs the official suite with code generation blocked
      # (tests/test_no_eval.js), so this job needs the submodule the same way
      # test-suite does.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install RE2 (macOS)
        if: runner.os == 'macOS'
        run: brew install re2 abseil mimalloc

      - name: Install RE2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libre2-dev libabsl-dev

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Setup vcpkg
        if: runner.os == 'Windows'
        run: |
          C:\vcpkg\bootstrap-vcpkg.bat
        shell: cmd

      - name: Install RE2 (Windows)
        if: runner.os == 'Windows'
        run: |
          C:\vcpkg\vcpkg install re2:x64-windows-static
          C:\vcpkg\vcpkg install abseil:x64-windows-static
        shell: cmd

      - name: Set Toolchain and Triplet
        if: runner.os == 'Windows'
        run: |
          echo "CMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VCPKG_TARGET_TRIPLET=x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        run: npm ci

      - name: Build native addon
        run: npm run build

      # npm ci brings the published per-platform engine of the same
      # version, which the loader prefers over the build above; remove it so
      # the tests run the engine built from this commit.
      - name: Use the engine built from this commit
        run: |
          node -e "require('fs').rmSync('node_modules/@ata-validator', { recursive: true, force: true })"

      - name: Run Node.js tests
        run: npm test

      - name: Run compat tests
        run: npm run test:compat

      - name: Run Standard Schema tests
        run: npm run test:standard-schema

  test-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install RE2
        run: sudo apt-get update && sudo apt-get install -y libre2-dev libabsl-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Run C++ tests
        run: ./build/ata_tests

  test-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install RE2
        run: sudo apt-get update && sudo apt-get install -y libre2-dev libabsl-dev

      - name: Install dependencies
        run: npm ci

      - name: Build native addon
        run: npm run build

      # npm ci brings the published per-platform engine of the same
      # version, which the loader prefers over the build above; remove it so
      # the tests run the engine built from this commit.
      - name: Use the engine built from this commit
        run: |
          node -e "require('fs').rmSync('node_modules/@ata-validator', { recursive: true, force: true })"

      - name: Run JSON Schema Test Suite
        run: npm run test:suite

  # Deno: the package from this checkout, the eval-free path (Deno Deploy
  # refuses dynamic code) and the official suite, all run by Deno itself.
  # No npm install: nothing here needs a dependency or the native engine.
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Package answers under Deno, with and without dynamic code
        run: deno run -A tests/deno_smoke.ts

      - name: Suite with eval and new Function blocked
        run: deno run -A tests/test_no_eval.js

      - name: Official JSON Schema Test Suite, three dialects
        run: |
          deno run -A tests/run_suite.js
          deno run -A tests/run_suite.js draft7
          deno run -A tests/run_suite.js v1
          deno run -A tests/run_suite.js draft6
          deno run -A tests/run_suite.js draft2019-09

  test-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install RE2
        run: sudo apt-get update && sudo apt-get install -y libre2-dev libabsl-dev

      - name: Install dependencies
        run: npm ci

      - name: Build native addon
        run: npm run build

      # npm ci brings the published per-platform engine of the same
      # version, which the loader prefers over the build above; remove it so
      # the tests run the engine built from this commit.
      - name: Use the engine built from this commit
        run: |
          node -e "require('fs').rmSync('node_modules/@ata-validator', { recursive: true, force: true })"

      - name: Run TS generator fixtures
        run: npm run test:ts

      - name: Run TS corpus (draft 2020-12)
        run: npm run test:ts-corpus

      - name: Run TS corpus (draft 7)
        run: CORPUS_DRAFT=draft7 npm run test:ts-corpus

      - name: Run TS differential (draft 2020-12)
        run: npm run test:ts-differential

      - name: Run TS differential (draft 7)
        run: CORPUS_DRAFT=draft7 npm run test:ts-differential
