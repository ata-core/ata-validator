name: Prebuild & Publish

on:
  release:
    types: [published]
  # Manual runs republish the version in package.json on the chosen ref. The
  # publish job skips anything already on the registry, so a re-run after a
  # partial failure is safe.
  workflow_dispatch:

# Read-only unless a job asks for more; the publish job raises id-token itself.
permissions:
  contents: read

jobs:
  prebuild:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            target: linux-x64-gnu
          - os: ubuntu-24.04-arm
            arch: arm64
            target: linux-arm64-gnu
          - os: macos-latest
            arch: arm64
            target: darwin-arm64
          # Intel macOS. The x64 runners were unavailable for a stretch, which
          # is why darwin-x64 was dropped in 0.13.4; `macos-15-intel` brought
          # them back.
          - os: macos-15-intel
            arch: x64
            target: darwin-x64
          - os: windows-latest
            arch: x64
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install re2 abseil

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Setup vcpkg
        if: runner.os == 'Windows'
        run: |
          C:\vcpkg\bootstrap-vcpkg.bat
        shell: cmd

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        run: |
          C:\vcpkg\vcpkg install re2:x64-windows-static
          C:\vcpkg\vcpkg install abseil:x64-windows-static
        shell: cmd

      - name: Set Toolchain and Triplet
        if: runner.os == 'Windows'
        run: |
          echo "CMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VCPKG_TARGET_TRIPLET=x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        if: runner.os != 'Linux'
        run: npm ci

      - name: Build native addon
        if: runner.os != 'Linux'
        run: npm run build

      # Linux builds in a manylinux_2_28 container so the addon needs no newer
      # glibc or libstdc++ than Node itself; the script strips the binary,
      # checks the floor and loads it. See scripts/build-manylinux.sh.
      - name: Build native addon (Linux, manylinux_2_28)
        if: runner.os == 'Linux'
        run: |
          IMAGE=quay.io/pypa/manylinux_2_28_$([ "${{ matrix.arch }}" = "arm64" ] && echo aarch64 || echo x86_64)
          docker run --rm -v "${{ github.workspace }}":/work -w /work "$IMAGE" bash scripts/build-manylinux.sh

      # Symbols are for debugging, not for running, and they were a sixth of
      # every Linux binary. pkg-prebuilds stripped them until 1.1.0 replaced it
      # with a plain build, which dropped the strip without anyone noticing.
      # -x keeps the exported symbols Node loads through; Linux strips in
      # scripts/build-manylinux.sh.
      - name: Strip symbols (macOS)
        if: runner.os == 'macOS'
        run: |
          strip -x build/Release/ata.node
          ls -l build/Release/ata.node

      # Stripping rewrites the Mach-O and invalidates the ad-hoc signature the
      # linker applied. arm64 macOS refuses to load unsigned code, so the
      # binary must be re-signed and verified before it ships.
      - name: Re-sign and verify macOS prebuild
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - build/Release/ata.node
          codesign --verify --verbose build/Release/ata.node

      - name: Assemble native package
        run: node scripts/make-native-package.js --binary build/Release/ata.node --target ${{ matrix.target }} --out native-packages

      # The binary that ships, after strip and signing, must load and answer.
      - name: Load the shipped addon
        run: node scripts/smoke-native.js

      - name: Upload native package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-pkg-${{ matrix.target }}
          path: native-packages/

  prebuild-musl:
    # Both targets build natively: amd64 on the standard runner, arm64 on the
    # arm64 runner the gnu prebuild already uses. The arm64 build ran under
    # QEMU before, and the emulator began dying with SIGILL (exit 132) at the
    # same apk step on every attempt of the 1.12.0 release, six of six, so it
    # stopped being a retry problem and the emulator went away instead.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            target: linux-x64-musl
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            target: linux-arm64-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build in Alpine container
        # The retry loop predates the native runners and stays as a cheap
        # guard. SIGILL could land mid-install and leave node_modules half
        # written, which made the next attempt fail on ENOTEMPTY instead of
        # retrying cleanly, so each attempt starts from an empty tree.
        run: |
          for attempt in 1 2 3; do
            docker run --rm --platform ${{ matrix.platform }} \
              -v ${{ github.workspace }}:/work -w /work \
              node:22-alpine sh -c "
                rm -rf node_modules build &&
                apk add --no-cache git python3 make g++ cmake re2-dev abseil-cpp-dev linux-headers &&
                npm ci &&
                npx cmake-js build --target ata &&
                strip --strip-unneeded build/Release/ata.node &&
                ls -l build/Release/ata.node &&
                node scripts/smoke-native.js
              " && break
            status=$?
            if [ "$attempt" = "3" ]; then exit "$status"; fi
            echo "build attempt $attempt failed with $status; retrying"
            sleep 15
          done

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Assemble native package
        run: node scripts/make-native-package.js --binary build/Release/ata.node --target ${{ matrix.target }} --out native-packages

      - name: Upload native package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-pkg-${{ matrix.target }}
          path: native-packages/

  publish:
    needs: [prebuild, prebuild-musl]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # npm trusted publishing (OIDC) needs npm 11.5.1+; Node 22 ships npm 10.
      # Pinned to a version, so the publish does not run whatever npm shipped
      # that morning.
      - name: Update npm for trusted publishing
        run: npm install -g npm@12.2.0

      # Not `npm ci`: the lockfile cannot carry the seven native packages this
      # job publishes, because they do not exist when the version is bumped,
      # and npm 12 refuses a clean install over that gap (1.47.0's first run
      # failed here). The lock still pins everything else; the optionals are
      # left out since nothing here needs an engine.
      - name: Install dependencies
        run: npm install --ignore-scripts --omit=optional --no-audit --no-fund

      - name: Download native packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: native-packages/
          pattern: native-pkg-*
          merge-multiple: true

      - name: Publish native packages
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for dir in native-packages/native-*; do
            NAME=$(node -p "require('./$dir/package.json').name")
            if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
              echo "$NAME@$VERSION already published, skipping"
            else
              (cd "$dir" && npm publish --access public)
            fi
          done
          # The core must not publish before every native it pins is visible,
          # or an install resolves the new core against missing binaries. The
          # budget is 15 minutes because 5 was not enough: 1.30.2 published all
          # seven natives, then failed here waiting for linux-x64-gnu, which
          # appeared shortly after. Waiting longer costs nothing when the
          # registry is quick.
          for t in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu linux-x64-musl linux-arm64-musl win32-x64; do
            for i in $(seq 1 90); do
              npm view "@ata-validator/native-$t@$VERSION" version > /dev/null 2>&1 && break
              [ "$i" = "90" ] && { echo "native-$t@$VERSION not visible after 15 minutes; the natives are published, so re-run this job rather than re-releasing"; exit 1; }
              sleep 10
            done
          done

      - name: Publish core
        run: npm publish
