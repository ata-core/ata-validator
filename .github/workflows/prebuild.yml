name: Prebuild & Publish

on:
  release:
    types: [published]

jobs:
  prebuild:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            target: linux-x64-gnu
          - os: ubuntu-24.04-arm
            arch: arm64
            target: linux-arm64-gnu
          - os: macos-latest
            arch: arm64
            target: darwin-arm64
          - os: windows-latest
            arch: x64
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install re2 abseil mimalloc

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libre2-dev libabsl-dev

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup vcpkg
        if: runner.os == 'Windows'
        run: |
          C:\vcpkg\bootstrap-vcpkg.bat
        shell: cmd

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        run: |
          C:\vcpkg\vcpkg install re2:x64-windows-static
          C:\vcpkg\vcpkg install abseil:x64-windows-static
        shell: cmd

      - name: Set Toolchain and Triplet
        if: runner.os == 'Windows'
        run: |
          echo "CMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VCPKG_TARGET_TRIPLET=x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        run: npm install

      - name: Build native addon
        run: npm run build

      # `strip -Sx` rewrites the Mach-O and invalidates the ad-hoc signature
      # the linker applied. arm64 macOS refuses to load unsigned code, so the
      # binary must be re-signed and verified before it ships.
      - name: Re-sign and verify macOS prebuild
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - build/Release/ata.node
          codesign --verify --verbose build/Release/ata.node

      - name: Assemble native package
        run: node scripts/make-native-package.js --binary build/Release/ata.node --target ${{ matrix.target }} --out native-packages

      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: native-pkg-${{ matrix.target }}
          path: native-packages/

  prebuild-musl:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: linux/amd64
            target: linux-x64-musl
          - arch: arm64
            platform: linux/arm64
            target: linux-arm64-musl
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'arm64'

      - name: Build in Alpine container
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v ${{ github.workspace }}:/work -w /work \
            node:22-alpine sh -c "
              apk add --no-cache git python3 make g++ cmake re2-dev abseil-cpp-dev linux-headers &&
              npm install &&
              npx cmake-js build --target ata
            "

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble native package
        run: node scripts/make-native-package.js --binary build/Release/ata.node --target ${{ matrix.target }} --out native-packages

      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: native-pkg-${{ matrix.target }}
          path: native-packages/

  publish:
    needs: [prebuild, prebuild-musl]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm trusted publishing (OIDC) needs npm 11.5.1+; Node 22 ships npm 10.
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Download native packages
        uses: actions/download-artifact@v4
        with:
          path: native-packages/
          pattern: native-pkg-*
          merge-multiple: true

      - name: Publish native packages
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for dir in native-packages/native-*; do
            NAME=$(node -p "require('./$dir/package.json').name")
            if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
              echo "$NAME@$VERSION already published, skipping"
            else
              (cd "$dir" && npm publish --access public)
            fi
          done
          for t in darwin-arm64 linux-x64-gnu linux-arm64-gnu linux-x64-musl linux-arm64-musl win32-x64; do
            for i in $(seq 1 30); do
              npm view "@ata-validator/native-$t@$VERSION" version > /dev/null 2>&1 && break
              [ "$i" = "30" ] && { echo "native-$t@$VERSION not visible after 5 minutes"; exit 1; }
              sleep 10
            done
          done

      - name: Publish core
        run: npm publish
