# Publishes jsr/ as @ata/validator on JSR after a release. The JSR package
# re-exports the npm package of the same version, so this waits for that
# version to be visible on the npm registry first; the npm publish runs in
# prebuild.yml on the same release event. JSR authenticates the workflow by
# its OIDC identity once the package is linked to this repository on jsr.io.
name: JSR

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The registry lists a version minutes before its tarball can be fetched
      # (1.48.0: nine minutes), and deno publish needs the tarball, so the wait
      # is for the tarball itself, not the listing.
      - name: Wait for the npm version this package re-exports
        run: |
          VERSION=$(node -p "require('./jsr/jsr.json').version")
          URL="https://registry.npmjs.org/ata-validator/-/ata-validator-$VERSION.tgz"
          for i in $(seq 1 120); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$URL")" = "200" ] && exit 0
            sleep 15
          done
          echo "$URL not fetchable after 30 minutes"
          exit 1

      - name: Publish
        working-directory: jsr
        run: deno publish
